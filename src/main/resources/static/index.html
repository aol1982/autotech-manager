<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoTech Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-image: url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { 
            width: 100%; 
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            color: white;
        }
        .login-card .card-header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px 15px 0 0 !important;
        }
        .form-control { background: rgba(255, 255, 255, 0.8); border: none; }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="card-header text-center py-3">
            <h3 class="mb-0 text-white fw-bold">🔧 AutoTech Manager</h3>
        </div>
        <div class="card-body p-4">
            <form id="form-login" onsubmit="procesarLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Usuario</label>
                    <input type="text" class="form-control" id="login-user" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="login-pass" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Ingresar al Sistema</button>
            </form>
            <div id="login-error" class="text-danger mt-3 text-center fw-bold bg-white rounded p-1" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function procesarLogin(event) {
            event.preventDefault();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-pass').value;

            const res = await fetch('/api/usuarios/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('userRole', data.rol);
                // GUARDAMOS EL USERNAME PARA QUE APAREZCA EN EL SISTEMA
                localStorage.setItem('userName', data.username); 
                
                if (data.rol === 'Mecanico') {
                    localStorage.setItem('nombreMecanico', data.nombre_completo);
                } else {
                    localStorage.removeItem('nombreMecanico');
                }
                
                window.open('sistema.html', '_blank');
                window.close();
            } else {
                const errorDiv = document.getElementById('login-error');
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Usuario o contraseña incorrectos";
            }
        }
    </script>
</body>
</html>
